<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7FAE9A"><title>Oasis Rhythm</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body><header class="app-header"><div><div class="eyebrow">OASIS</div><h1>Rhythm</h1><p>Daily lifestyle check-in</p></div><button id="exportBtn" class="ghost">Export</button></header><main><nav class="tabs"><button class="tab active" data-tab="today">Today</button><button class="tab" data-tab="trends">Trends</button></nav><section class="glance">
<div class="mini"><b>⚖️</b><span>Weight<strong id="glanceWeight">—</strong></span></div>
<div class="mini"><b>⚡</b><span>Energy<strong id="glanceEnergy">—</strong></span></div>
<div class="mini"><b>💧</b><span>Water<strong id="glanceWater">—</strong></span></div>
<div class="mini"><b>💪</b><span>Protein<strong id="glanceProtein">—</strong></span></div>
</section><section id="today" class="panel active"><form id="checkinForm"><div class="card"><h2>☀️ Morning</h2><div class="grid two"><label>Date<input id="date" type="date" required></label><label>Weight (kg)<input id="weight" type="number" step="0.1" min="30" max="250"></label><label>Cycle day<input id="cycleDay" type="number" min="1" max="60"></label><label>Period status<select id="periodStatus"><option value="">—</option><option>None</option><option>Spotting</option><option>Light</option><option>Moderate</option><option>Heavy</option></select></label><label>Bedtime<input id="bedtime" type="time"></label><label>Wake time<input id="wakeTime" type="time"></label><label>Night awakenings<input id="awakenings" type="number" min="0" max="20"></label><label>Magnesium last night<select id="magnesium"><option value="">—</option><option>Yes</option><option>No</option><option>Unsure</option></select></label></div><div class="range-row"><label>Sleep quality <span id="sleepQualityOut">5</span>/10<input id="sleepQuality" type="range" min="1" max="10" value="5"></label><label>Morning mood <span id="morningMoodOut">5</span>/10<input id="morningMood" type="range" min="1" max="10" value="5"></label><label>Morning energy <span id="morningEnergyOut">5</span>/10<input id="morningEnergy" type="range" min="1" max="10" value="5"></label></div></div><div class="card"><h2>🌙 Evening</h2><div class="range-row"><label>Mood <span id="moodOut">5</span>/10<input id="mood" type="range" min="1" max="10" value="5"></label><label>Energy <span id="energyOut">5</span>/10<input id="energy" type="range" min="1" max="10" value="5"></label><label>Hunger <span id="hungerOut">5</span>/10<input id="hunger" type="range" min="1" max="10" value="5"></label><label>Food noise <span id="foodNoiseOut">5</span>/10<input id="foodNoise" type="range" min="1" max="10" value="5"></label><label>Strength/performance <span id="strengthOut">5</span>/10<input id="strength" type="range" min="1" max="10" value="5"></label></div><div class="grid two"><label>Water (L)<input id="water" type="number" step="0.1" min="0" max="10"></label><label>Caffeinated coffees<input id="coffeeCaf" type="number" min="0" max="20"></label><label>Decaf coffees<input id="coffeeDecaf" type="number" min="0" max="20"></label><label>Workout<select id="workout"><option value="">—</option><option>None</option><option>Legs</option><option>Glutes</option><option>Upper body</option><option>Back & arms</option><option>Abs</option><option>Swimming</option><option>Walking/Cardio</option><option>Other</option></select></label><label>Workout duration (min)<input id="workoutMinutes" type="number" min="0" max="300"></label><label>Nap (min)<input id="napMinutes" type="number" min="0" max="300"></label></div></div><div class="card"><h2>🥗 Nutrition</h2><div class="grid three"><label>Calories<input id="calories" type="number" min="0" max="10000"></label><label>Protein (g)<input id="protein" type="number" min="0" max="500"></label><label>Fiber (g)<input id="fiber" type="number" min="0" max="150"></label></div></div><div class="card"><h2>✦ Notes & symptoms</h2><div class="chips"><label><input type="checkbox" value="Headache" class="symptom"> Headache</label><label><input type="checkbox" value="Neck stiffness" class="symptom"> Neck stiffness</label><label><input type="checkbox" value="Fatigue" class="symptom"> Fatigue</label><label><input type="checkbox" value="Soreness" class="symptom"> Soreness</label><label><input type="checkbox" value="Cravings" class="symptom"> Cravings</label><label><input type="checkbox" value="Bloating" class="symptom"> Bloating</label><label><input type="checkbox" value="Meds missed" class="symptom"> Meds missed</label></div><label>Notes<textarea id="notes" rows="4" placeholder="Anything unusual or worth remembering..."></textarea></label></div><button class="primary" type="submit">Save today</button><div id="saveMsg" class="save-msg"></div></form></section><section id="trends" class="panel"><div class="card"><h2>Trends</h2><p class="muted">Your saved entries stay on this device. Choose a metric to view the last 30 entries.</p><select id="metricSelect"><option value="weight">Weight</option><option value="sleepQuality">Sleep quality</option><option value="morningEnergy">Morning energy</option><option value="energy">Evening energy</option><option value="hunger">Hunger</option><option value="foodNoise">Food noise</option><option value="strength">Strength</option><option value="water">Water</option><option value="calories">Calories</option><option value="protein">Protein</option><option value="fiber">Fiber</option></select><div class="chart-wrap"><canvas id="trendCanvas" width="800" height="420"></canvas><div id="chartTooltip" class="chart-tooltip" hidden></div></div></div><div class="card"><h2>Recent entries</h2><div id="recentEntries" class="entries"></div><div id="dayDetail" class="daydetail" hidden></div></div></section></main><script src="app.js"></script></body></html>
